[project]
name = "segmambapr"
version = "1.0.0"
description = "SegMambaPR: pancreatic tumor segmentation and segmentation-based resectability estimation on CT"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "torch",
    "monai",
    "mamba-ssm",
    "einops",
    "nibabel",
    "numpy",
    "scipy",
    "pandas",
    "openpyxl",
    "scikit-learn",
    "matplotlib",
    "pyyaml",
]

[project.optional-dependencies]
text = ["sentence-transformers"]

[tool.uv]
package = false
